# agent
agent_name: atari_agent

# environment
env:
  env: VGDL
  game: VGDL_vgfmri4_bait
  base_seed: 0
  n_skip: 1
  n_stack: 4
  max_episode_steps: 2000
  episodic: True
  gray_scale: True
  image_based: True
  clip_reward: False
  obs_shape: [1, 84, 84]
  obs_to_string: False
  resize: 84
  games_folder: all_games_recovered
  rc_rl_root: /gpfs3/well/costa/users/zqa082/brain-wide_strategies/RC_RL
  level_mode: sequential
  level_seed: 0
  fixed_level: null
  curriculum:
    enabled: True
    start_level: 0
    target_win_rate: 0.85
    min_episodes: 200
    recent_window: 160
    max_episodes: 800

  reward_shaping:
    scale: 1.0
    w_box: 3.0
    w_mushroom: 2.0
    w_key_dist: 1.5
    w_goal_dist: 2.5
    win_bonus: 5.0
    step_penalty: -0.01

rl:
  discount: 0.997
  unroll_steps: 5
  td_steps: 5
  auto_td_steps: 30000
  td_lambda: 0.95

train:
  load_model_path: ''
  batch_size: 128
  training_steps: 100000
  offline_training_steps: 2000
  start_transitions: 2000
  random_warmup_steps: 500
  new_level_random_steps: 500
  eval_n_episode: 10
  eval_interval: 5000
  self_play_update_interval: 5
  reanalyze_update_interval: 10
  save_ckpt_interval: 1000
  mini_batch_size: 128
  reanalyze_ratio: 1.0
  reward_loss_coeff: 1.0
  value_loss_coeff: 0.5
  policy_loss_coeff: 1.0
  consistency_coeff: 5.0
  decorrelation_coeff: 0.01
  off_diag_coeff: 5e-3
  entropy_coeff: 1e-2
  max_grad_norm: 5
  change_temperature: True
  periodic_reset: False
  value_reanalyze: False
  path_consistency: False
  use_decorrelation: False
  value_policy_detach: False
  optimal_Q: False
  v_num: 1
  value_target: 'mixed'
  use_IQL: False
  IQL_weight: 0.7
  start_use_mix_training_steps: 3e3
  mixed_value_threshold: 5e2

optimizer:
  type: Adam
  lr: 1e-3
  lr_decay_type: none
  lr_warm_up: 0.01
  lr_decay_rate: 0.1
  lr_decay_steps: 100000
  weight_decay: 1e-4

priority:
  use_priority: True
  priority_prob_alpha: 1.0
  priority_prob_beta: 1.0
  min_prior: 0.000001

data:
  num_envs: 8
  buffer_size: 100000
  total_transitions: 100000
  top_transitions: 100000
  trajectory_size: 160
  save_video: False
  save_as_dataset: False

mcts:
  language: cython
  num_simulations: 150
  num_top_actions: 6
  num_sampled_actions: 4
  c_visit: 50
  c_scale: 0.1
  c_base: 19652
  c_init: 1.25
  dirichlet_alpha: 0.6
  explore_frac: 0.35
  value_minmax_delta: 0.01
  vis: ['print']
  mpc_horizon: 1
  use_gumbel: True

model:
  noisy_net: False
  action_embedding: True
  action_embedding_dim: 16
  down_sample: True
  state_norm: False
  value_prefix: True
  value_target: bootstrapped
  GAE_max_steps: 15
  init_zero: True
  num_blocks: 1
  num_channels: 64
  reduced_channels: 16
  projection_layers: [1024, 1024]
  prjection_head_layers: [256, 1024]
  fc_layers: [32]
  lstm_hidden_size: 512
  lstm_horizon_len: 5
  policy_loss_type: reanalyze
  reward_support:
    range: [-40, 40]
    scale: 1
    env: Atari
    bins: 41
    type: support
  value_support:
    range: [-40, 40]
    scale: 1
    env: Atari
    bins: 41
    type: support

actors:
  data_worker: 1
  batch_worker: 8

wandb:
  project: ezv2-vgdl
  tag: VGDL

log:
  ckpt_interval: 1000
  eval_interval: 5000
  save_dir: ./outputs/vgdl_bait

ray:
  object_store_memory: 412316860416  # 384 GiB
